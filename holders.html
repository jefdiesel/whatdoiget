<link rel="stylesheet" href="./style.css">
<style>
  /* style.css centres main as a flex column, which shrink-wraps every child.
     This page is a document, not a gallery, so lay it out as one. */
  main.holders { display: block; max-width: 62ch; margin: 0 auto; padding: 34px 22px 120px; }
  .bar { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
  .bar h2 { font-family: Haettenschweiler,'Arial Narrow',Impact,sans-serif;
            font-size: 30px; margin: 0; transform: skewX(-9deg); }
  #count { opacity: .55; }
  dl { margin: 0; border-top: 3px solid var(--ink); }
  .row { display: flex; justify-content: space-between; gap: 20px; padding: 7px 0;
         border-bottom: 1px solid rgba(22,32,43,.22); }
  .row dt { display: flex; gap: 10px; align-items: baseline; }
  .row dt a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(22,32,43,.35);
              font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0;
              text-transform: none; }
  .row dt a:hover { color: var(--spot); border-color: currentColor; }
  .row dt a.ext { border: 0; opacity: .5; }
  .row dt a.ext:hover { opacity: 1; }
  .row dd { margin: 0; font-weight: bold; }
  .note { text-transform: none; letter-spacing: 0; font-family: Helvetica, Arial, sans-serif;
          font-size: 13px; opacity: .7; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
           border-top: 3px solid var(--ink); display: flex; align-items: center; gap: .3em;
           padding: 7px 16px; font-size: 19px; line-height: 1;
           font-family: Haettenschweiler,'Arial Narrow',Impact,sans-serif; text-transform: uppercase; }
  footer > * { transform: skewX(-9deg); }
  footer .mark { font-weight: 700; }
  footer a { color: var(--ink); text-decoration: none; }
  footer a:hover { color: var(--spot); }
  footer .dot { opacity: .5; }
</style>
</head>
