[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
ffi = true
fs_permissions = [{ access = "read", path = "./data" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
