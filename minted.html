<style>
  main { max-width: 1300px; margin: 0 auto; padding: 24px 22px 90px; }
  .bar { justify-content: center; }

  #grid { display: grid; gap: 0; margin: 0 auto; }
  #grid figure { margin: 0; cursor: pointer; position: relative; line-height: 0; }
  #grid figure:hover svg { outline: 3px solid var(--spot); outline-offset: -3px; }
  .tag { position: absolute; left: 5px; bottom: 4px; font-size: 9px; line-height: 1;

  #grid figure:hover .tag { opacity: 1; }
  #grid svg { width: 100%; height: auto; display: block; }
  #overlay { position: fixed; inset: 0; background: rgba(236,228,212,.97); z-index: 20;
             display: none; overflow-y: auto; }
  #overlay.on { display: block; }
  #overlay .inner { min-height: 100%; box-sizing: border-box; display: flex;
                    align-items: flex-start; justify-content: center; flex-wrap: wrap;
                    gap: clamp(20px,3vw,44px); padding: clamp(18px,3vw,40px); }
  #overlay svg { width: min(58vh, 46vw, 520px); min-width: 220px; height: auto; display: block;

  #meta { min-width: 260px; flex: 0 1 330px; }
  #meta h2 { font-family: Haettenschweiler,'Arial Narrow',Impact,sans-serif; font-size: 30px;
             margin: -.16em 0 12px; transform: skewX(-9deg); }
  #meta dl { margin: 0; border-top: 2px solid var(--ink); }
  #meta .row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0;
               border-bottom: 1px solid rgba(22,32,43,.22); }
  #meta dt { opacity: .6; } #meta dd { margin: 0; font-weight: bold; }
  #meta dd.prov { color: var(--spot); }
  #meta dd a { color: var(--spot); }
  #detail-close { margin-top: 16px; }
  .note { text-transform: none; letter-spacing: 0; font-family: Helvetica, Arial, sans-serif;
          font-size: 13px; opacity: .7; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
           border-top: 3px solid var(--ink); display: flex; align-items: center; gap: .3em;
           padding: 7px 16px; font-size: 19px; line-height: 1;
           font-family: Haettenschweiler,'Arial Narrow',Impact,sans-serif; text-transform: uppercase; }
  footer > * { transform: skewX(-9deg); }
  footer .mark { font-weight: 700; }
  footer a { color: var(--ink); text-decoration: none; }
  footer a:hover { color: var(--spot); }
  footer .dot { opacity: .5; }
